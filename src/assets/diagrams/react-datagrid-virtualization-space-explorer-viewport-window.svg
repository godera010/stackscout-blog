<svg viewBox="0 0 800 420" width="800" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Viewport virtualization mapping rows to DOM nodes</title>
  <desc id="desc">A tall list of over 100,000 rows has a small visible viewport window highlighted; only the rows inside that window map to actual mounted DOM nodes, keeping the DOM node count under 100.</desc>
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .lbl { fill:#f1f5f9; font-size:14px; }
    .sub { fill:#b9c2cf; font-size:12.5px; text-anchor:middle; }
    .edge { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#arrow5); }
    .tag { fill:#94a3b8; font-size:13px; font-weight:600; }
    .row { fill:#1e293b99; stroke:#475569; stroke-width:1.5; }
  </style>

  <text x="140" y="26" class="tag" text-anchor="middle">100,000+ rows</text>
  <rect x="40" y="36" width="200" height="340" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <g>
    <rect x="52" y="48" width="176" height="18" class="row"/>
    <rect x="52" y="70" width="176" height="18" class="row"/>
    <rect x="52" y="92" width="176" height="18" class="row"/>
    <rect x="52" y="114" width="176" height="18" class="row"/>
    <rect x="52" y="136" width="176" height="18" class="row"/>
  </g>

  <rect x="48" y="166" width="184" height="90" rx="4" fill="#f59e0b22" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="52" y="172" width="176" height="18" class="row" stroke="#f59e0b"/>
  <rect x="52" y="194" width="176" height="18" class="row" stroke="#f59e0b"/>
  <rect x="52" y="216" width="176" height="18" class="row" stroke="#f59e0b"/>
  <rect x="52" y="238" width="176" height="18" class="row" stroke="#f59e0b"/>
  <text x="140" y="270" class="tag" text-anchor="middle" fill="#f59e0b">Visible viewport</text>

  <g>
    <rect x="52" y="290" width="176" height="18" class="row"/>
    <rect x="52" y="312" width="176" height="18" class="row"/>
    <rect x="52" y="334" width="176" height="18" class="row"/>
    <rect x="52" y="356" width="176" height="18" class="row"/>
  </g>
  <text x="140" y="398" class="sub">Rows outside the window are never mounted</text>

  <path class="edge" d="M232,182 C 340,160 420,160 470,172"/>
  <path class="edge" d="M232,210 C 340,196 420,196 470,204"/>
  <path class="edge" d="M232,238 C 340,232 420,232 470,232"/>

  <rect x="480" y="56" width="280" height="260" rx="10" fill="#1e293bf2" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="84" class="lbl" text-anchor="middle" font-weight="600">Mounted DOM Nodes</text>
  <text x="620" y="104" class="sub">&lt; 100 nodes, position via CSS transform</text>

  <rect x="500" y="120" width="240" height="26" rx="6" fill="#16a34a22" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="137" class="lbl" text-anchor="middle" font-size="13">Row node — recycled</text>

  <rect x="500" y="156" width="240" height="26" rx="6" fill="#16a34a22" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="173" class="lbl" text-anchor="middle" font-size="13">Row node — recycled</text>

  <rect x="500" y="192" width="240" height="26" rx="6" fill="#16a34a22" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="209" class="lbl" text-anchor="middle" font-size="13">Row node — recycled</text>

  <text x="620" y="250" class="sub">As the user scrolls, a node's absolute</text>
  <text x="620" y="268" class="sub">offset is rewritten instead of creating</text>
  <text x="620" y="286" class="sub">or destroying DOM elements.</text>
</svg>
