<svg viewBox="0 0 800 460" width="800" height="460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic scope gating flow</title>
  <desc id="desc">A user query passes through a deterministic scope gate before reaching the vector database; out-of-scope queries get a fast refusal, in-scope queries proceed to retrieval, the LLM, and a validated answer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .lbl { fill:#f1f5f9; font-size:15px; text-anchor:middle; }
    .sub { fill:#b9c2cf; font-size:13px; text-anchor:middle; }
    .edge { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#arrow); }
    .tag { fill:#6b7a90; font-size:13px; text-anchor:middle; font-weight:600; }
  </style>

  <rect x="280" y="20" width="240" height="56" rx="10" fill="#1e293bf2" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="54" class="lbl">Incoming User Query</text>

  <path class="edge" d="M400,76 L400,114"/>

  <rect x="240" y="118" width="320" height="64" rx="10" fill="#1e293bf2" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="144" class="lbl">Deterministic Scope Gate</text>
  <text x="400" y="166" class="sub">Entity boundary regex check</text>

  <path class="edge" d="M330,182 C 260,214 200,224 165,254"/>
  <text x="195" y="214" class="tag">Out-of-scope</text>

  <path class="edge" d="M470,182 C 540,214 600,224 635,254"/>
  <text x="610" y="214" class="tag">In-scope</text>

  <rect x="40" y="258" width="250" height="64" rx="10" fill="#1e293bf2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="284" class="lbl">Fast Refusal</text>
  <text x="165" y="306" class="sub">&lt;1ms, $0 cost</text>
  <text x="165" y="344" class="sub">"Provider not in corpus"</text>

  <rect x="510" y="258" width="250" height="64" rx="10" fill="#1e293bf2" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="284" class="lbl">Vector Search + RAG</text>
  <text x="635" y="306" class="sub">Retrieve grounded context</text>

  <path class="edge" d="M635,322 L635,350"/>

  <rect x="510" y="354" width="250" height="52" rx="10" fill="#1e293bf2" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="386" class="lbl">LLM</text>

  <path class="edge" d="M635,406 L635,420"/>

  <rect x="510" y="424" width="250" height="36" rx="10" fill="#1e293bf2" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="447" class="lbl" font-size="14">Validated, Grounded Answer</text>
</svg>
