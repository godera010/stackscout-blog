<svg viewBox="0 0 800 340" width="800" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Brain-and-Hands pattern</title>
  <desc id="desc">AWS cloud infrastructure sends read-only telemetry to the AWS DevOps Agent MCP, the brain, which synthesizes root causes; Kiro Crew, the hands, runs audits and applies gated write actions back to the infrastructure.</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .lbl { fill:#f1f5f9; font-size:15px; text-anchor:middle; font-weight:600; }
    .sub { fill:#b9c2cf; font-size:12.5px; }
    .edge { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#arrow3); }
    .tag { fill:#94a3b8; font-size:13px; text-anchor:middle; font-weight:600; }
  </style>

  <rect x="150" y="20" width="500" height="56" rx="10" fill="#1e293bf2" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="46" class="lbl">AWS Cloud Infrastructure</text>
  <text x="400" y="65" class="sub" text-anchor="middle">ECS Clusters, Lambda, CodePipeline, VPC</text>

  <path class="edge" d="M280,76 L240,132"/>
  <text x="195" y="104" class="tag">Read-only</text>
  <text x="195" y="120" class="tag">telemetry</text>

  <path class="edge" d="M580,132 L545,76"/>
  <text x="615" y="104" class="tag">Gated write</text>
  <text x="615" y="120" class="tag">actions</text>

  <rect x="60" y="136" width="300" height="126" rx="10" fill="#1e293bf2" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="166" class="lbl">AWS DevOps Agent MCP</text>
  <text x="210" y="186" class="tag" font-weight="400">"The Brain" (read-only)</text>
  <text x="90" y="212" class="sub">• Reads CloudWatch &amp; X-Ray</text>
  <text x="90" y="232" class="sub">• Correlates CloudTrail events</text>
  <text x="90" y="252" class="sub">• Synthesizes root-cause hypotheses</text>

  <path class="edge" d="M360,198 L436,198"/>
  <text x="398" y="186" class="tag" font-size="11.5">MCP JSON</text>

  <rect x="440" y="136" width="300" height="126" rx="10" fill="#1e293bf2" stroke="#f59e0b" stroke-width="2"/>
  <text x="590" y="166" class="lbl">Kiro Crew</text>
  <text x="590" y="186" class="tag" font-weight="400">"The Hands" (execution)</text>
  <text x="470" y="212" class="sub">• Runs scheduled 30m audits</text>
  <text x="470" y="232" class="sub">• Requires approval or canary check</text>
  <text x="470" y="252" class="sub">• Applies gated CLI fixes</text>

  <text x="400" y="300" class="sub" text-anchor="middle" font-size="13">Diagnosis and execution stay separate; only the Hands can write to production.</text>
</svg>
