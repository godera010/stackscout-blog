<svg viewBox="0 0 800 420" width="800" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Istio and SPIFFE blast-radius quarantine around the NEXUS agent pod</title>
  <desc id="desc">The NEXUS agent pod runs inside an Istio mesh with a SPIFFE identity and strict mutual TLS; its sidecar allows read-only calls to Prometheus and Jaeger but denies every connection to the application namespaces.</desc>
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .lbl { fill:#f1f5f9; font-size:14px; text-anchor:middle; font-weight:600; }
    .sub { fill:#b9c2cf; font-size:12px; text-anchor:middle; }
    .mono { fill:#b9c2cf; font-size:11.5px; text-anchor:middle; font-family: ui-monospace, monospace; }
    .allow { fill:none; stroke:#16a34a; stroke-width:2.5; marker-end:url(#arrow6); }
    .deny { fill:none; stroke:#dc2626; stroke-width:2.5; stroke-dasharray:5,4; }
    .tag { font-size:12px; font-weight:600; text-anchor:middle; }
  </style>

  <rect x="40" y="30" width="400" height="360" rx="14" fill="#1e293b66" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="54" class="lbl" fill="#93c5fd">Istio Service Mesh — mTLS STRICT</text>

  <rect x="90" y="150" width="300" height="120" rx="10" fill="#1e293bf2" stroke="#7c3aed" stroke-width="2"/>
  <text x="240" y="178" class="lbl">NEXUS Agent Pod</text>
  <text x="240" y="200" class="mono">spiffe://cluster.local/ns/</text>
  <text x="240" y="216" class="mono">ai-agent/sa/ai-agent-sa</text>
  <rect x="130" y="228" width="220" height="30" rx="6" fill="#7c3aed22" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="240" y="248" class="sub">Envoy sidecar — AuthorizationPolicy</text>

  <path class="allow" d="M390,190 L470,120"/>
  <path class="allow" d="M390,230 L470,290"/>
  <path class="deny" d="M390,170 L470,190"/>
  <path class="deny" d="M390,250 L470,380"/>

  <rect x="480" y="90" width="260" height="56" rx="8" fill="#1e293bf2" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="112" class="lbl" fill="#86efac">Prometheus :9090</text>
  <text x="610" y="130" class="sub">ALLOW — read-only GET</text>

  <rect x="480" y="262" width="260" height="56" rx="8" fill="#1e293bf2" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="284" class="lbl" fill="#86efac">Jaeger</text>
  <text x="610" y="302" class="sub">ALLOW — read-only GET</text>

  <rect x="480" y="162" width="260" height="56" rx="8" fill="#1e293bf2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="184" class="lbl" fill="#fca5a5">lsd-payments namespace</text>
  <text x="610" y="202" class="sub">DENY — all TCP/HTTP</text>

  <rect x="480" y="352" width="260" height="56" rx="8" fill="#1e293bf2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="374" class="lbl" fill="#fca5a5">frontend namespace</text>
  <text x="610" y="392" class="sub">DENY — all TCP/HTTP</text>

  <text x="240" y="340" class="sub">Remediation requires an on-call engineer's approval —</text>
  <text x="240" y="356" class="sub">NEXUS cannot write to any namespace directly.</text>
</svg>
