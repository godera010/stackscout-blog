<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d8aa3"/></marker>
</defs>
<rect width="1376" height="768" fill="url(#bg)"/>
<text x="688" y="84" text-anchor="middle" font-size="42" font-weight="700" fill="#f1f5f9"><tspan fill="#f1f5f9">Quarantining NEXUS: </tspan><tspan fill="#a78bfa">Istio + SPIFFE</tspan><tspan fill="#f1f5f9"> Isolation</tspan></text>
<rect x="28" y="130" width="600" height="600" rx="18" fill="#0f1a30" stroke="#38bdf8" stroke-width="3"/>
<text x="328" y="172" text-anchor="middle" font-size="26" font-weight="700" fill="#38bdf8">Istio service mesh (Amazon EKS)</text>
<text x="328" y="204" text-anchor="middle" font-size="22" font-weight="600" fill="#38bdf8">mTLS STRICT</text>
<rect x="64" y="260" width="528" height="260" rx="14" fill="#111c33" stroke="#a78bfa" stroke-width="3"/>
<text x="328" y="306" text-anchor="middle" font-size="30" font-weight="700" fill="#f1f5f9">NEXUS agent pod</text>
<text x="328" y="352" text-anchor="middle" font-size="22" fill="#aab6c8" font-family="DejaVu Sans Mono,monospace">spiffe://cluster.local/ns/</text>
<text x="328" y="384" text-anchor="middle" font-size="22" fill="#aab6c8" font-family="DejaVu Sans Mono,monospace">ai-agent/sa/ai-agent-sa</text>
