<text x="328" y="622" text-anchor="middle" font-size="22" font-weight="400" fill="#aab6c8">(Grafana Cloud IRM or Discord).</text>
<text x="328" y="654" text-anchor="middle" font-size="22" font-weight="400" fill="#aab6c8">NEXUS cannot write directly.</text>
