<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d8aa3"/></marker>
</defs>
<rect width="1376" height="768" fill="url(#bg)"/>
<text x="688" y="84" text-anchor="middle" font-size="46" font-weight="700" fill="#f1f5f9"><tspan fill="#f1f5f9">Streaming I/O: </tspan><tspan fill="#34d399">O(1) Memory</tspan><tspan fill="#f1f5f9"> vs Batch Buffering</tspan></text>
<rect x="28" y="125" width="1320" height="270" rx="20" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="10,7"/>
<text x="60" y="170" text-anchor="start" font-size="28" font-weight="700" fill="#f87171">Flawed: in-memory batch buffering</text>
<rect x="80" y="205" width="320" height="150" rx="16" fill="#111c33" stroke="#38bdf8" stroke-width="3"/>
<text x="240.0" y="255" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Input</text>
<text x="240.0" y="308" text-anchor="middle" font-size="21" fill="#aab6c8">100k records</text>
<rect x="528" y="205" width="320" height="150" rx="16" fill="#111c33" stroke="#fbbf24" stroke-width="3"/>
<text x="688.0" y="255" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Giant buffer array</text>
<text x="688.0" y="308" text-anchor="middle" font-size="21" fill="#aab6c8">all cases held at once</text>
<rect x="976" y="205" width="320" height="150" rx="16" fill="#111c33" stroke="#f87171" stroke-width="3"/>
<text x="1136.0" y="255" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Memory Limit</text>
<text x="1136.0" y="309" text-anchor="middle" font-size="22" fill="#aab6c8">Exceeded (MLE)</text>
<line x1="404" y1="280" x2="524" y2="280" stroke="#7d8aa3" stroke-width="3.5" marker-end="url(#ar)"/>
<line x1="852" y1="280" x2="972" y2="280" stroke="#7d8aa3" stroke-width="3.5" marker-end="url(#ar)"/>
<rect x="28" y="420" width="1320" height="320" rx="20" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="10,7"/>
<text x="60" y="465" text-anchor="start" font-size="28" font-weight="700" fill="#34d399">Correct: streaming single-pass I/O</text>
<rect x="80" y="495" width="320" height="130" rx="16" fill="#111c33" stroke="#38bdf8" stroke-width="3"/>
<text x="240.0" y="569.1" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Read line</text>
<rect x="528" y="495" width="320" height="130" rx="16" fill="#111c33" stroke="#a78bfa" stroke-width="3"/>
<text x="688.0" y="569.1" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Process token</text>
<rect x="976" y="495" width="320" height="130" rx="16" fill="#111c33" stroke="#34d399" stroke-width="3"/>
<text x="1136.0" y="569.1" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Flush output</text>
<line x1="404" y1="560" x2="524" y2="560" stroke="#7d8aa3" stroke-width="3.5" marker-end="url(#ar)"/>
<line x1="852" y1="560" x2="972" y2="560" stroke="#7d8aa3" stroke-width="3.5" marker-end="url(#ar)"/>
<path d="M1136,630 L1136,690 L240,690 L240,630" fill="none" stroke="#7d8aa3" stroke-width="3.5" stroke-dasharray="8,6" marker-end="url(#ar)"/>
<text x="688" y="678" text-anchor="middle" font-size="22" font-weight="600" fill="#f1f5f9">Loop per record: constant O(1) storage</text>
</svg>
